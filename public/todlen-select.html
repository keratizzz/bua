<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลือกสาขา - ทอดเล่น Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="bg-slate-900 text-white p-6 rounded-2xl flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">👑 ศูนย์ควบคุมผู้ดูแลระบบ (Admin)</h1>
                <p class="text-xs text-slate-400">เลือกสาขาเพื่อเข้าจัดการระบบ POS หรือระบบส่วนแบ่งกำไร</p>
            </div>
            <button onclick="logout()" class="bg-slate-700 px-4 py-2 rounded-lg text-sm">ออกจากระบบ</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4">📍 สาขาโคราช</h2>
                <div class="space-y-3">
                    <a href="/todlen/korat/pos" class="block text-center bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl">🛒 หน้าจอ POS หน้าร้าน</a>
                    <a href="/todlen/korat/profit" class="block text-center bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl">📊 หน้าระบบส่วนแบ่งกำไร</a>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4">📍 สาขาบุรีรัมย์</h2>
                <div class="space-y-3">
                    <a href="/todlen/buriram/pos" class="block text-center bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl">🛒 หน้าจอ POS หน้าร้าน</a>
                    <a href="/todlen/buriram/profit" class="block text-center bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl">📊 หน้าระบบส่วนแบ่งกำไร (20% เข้าทุนโคราช)</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        function logout() {
            sessionStorage.clear();
            window.location.href = '/todlen/login';
        }
    </script>
</body>
</html>
